services:
  mysql:
    cpus: 1.0
    mem_limit: 1g

  redis:
    cpus: 0.5
    mem_limit: 256m

  toxiproxy:
    cpus: 0.25
    mem_limit: 128m

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payment_lab}
      MYSQL_USER: ${MYSQL_USER:-payment_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      REDIS_HOST: toxiproxy
      REDIS_PORT: 26379
      PAYMENT_STATUS_CACHE_ENABLED: ${PAYMENT_STATUS_CACHE_ENABLED:-false}
      PAYMENT_STATUS_CACHE_KEY_PREFIX: "payment:status:"
      PAYMENT_STATUS_CACHE_TTL: 5m
      PAYMENT_STATUS_CACHE_COMMAND_TIMEOUT: 100ms
      PAYMENT_STATUS_CACHE_CONNECT_TIMEOUT: 100ms
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${APP_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:ActiveProcessorCount=1}
    ports:
      - "127.0.0.1:${APP_PORT:-18082}:8080"
    cpus: 1.0
    mem_limit: 512m
    restart: "no"

  k6:
    image: grafana/k6:1.2.3
    environment:
      BASE_URL: http://app:8080
      RPS: ${K6_RPS:-100}
      DURATION: ${K6_DURATION:-120s}
      HOT_SET_SIZE: ${K6_HOT_SET_SIZE:-1000}
      EXPECTED_CACHE_RESULTS: ${K6_EXPECTED_CACHE_RESULTS:-DISABLED}
      SCENARIO_NAME: ${K6_SCENARIO_NAME:-measurement}
      SUMMARY_PATH: ${K6_SUMMARY_PATH:-/results/summary.json}
      ALLOW_DROPPED_ITERATIONS: ${K6_ALLOW_DROPPED_ITERATIONS:-false}
    volumes:
      - ./k6:/scripts:ro
      - ${PERFORMANCE_RESULTS_DIR:?Set PERFORMANCE_RESULTS_DIR}:/results
    cpus: 1.0
    mem_limit: 512m
    profiles: ["measurement"]
    restart: "no"
