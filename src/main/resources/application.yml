spring:
  application:
    name: payment-status-cache-lab
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:payment_lab}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${PAYMENT_STATUS_CACHE_COMMAND_TIMEOUT:100ms}
      connect-timeout: ${PAYMENT_STATUS_CACHE_CONNECT_TIMEOUT:100ms}
      repositories:
        enabled: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

payment:
  status-cache:
    enabled: ${PAYMENT_STATUS_CACHE_ENABLED:false}
    ttl: ${PAYMENT_STATUS_CACHE_TTL:5m}
    command-timeout: ${PAYMENT_STATUS_CACHE_COMMAND_TIMEOUT:100ms}
    connect-timeout: ${PAYMENT_STATUS_CACHE_CONNECT_TIMEOUT:100ms}

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    redis:
      enabled: ${PAYMENT_STATUS_CACHE_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
